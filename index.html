<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Wan! | 毎日違うワンちゃんに出会える癒しサイト</title>
  <meta name="description" content="毎日違う犬種のキャラクターに出会える、かわいい癒し系Webサイト「Today's Wan!」">
  <meta property="og:title" content="Today's Wan!">
  <meta property="og:description" content="毎日違うワンちゃんに出会える癒しサイト">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/ogp.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="assets/ogp.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Yomogi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
</head>
<body>
  <div class="app">
    <!-- ヘッダー -->
    <header class="header">
      <h1 class="logo">Today's Wan!</h1>
      <p class="header-sub">〜 毎日の癒しをお届け 〜</p>
    </header>

    <main>
      <!-- 今日 -->
      <section id="view-today" class="view active">
        <p id="today-date" class="date-label"></p>
        <div class="card today-card">
          <div class="img-wrap"><img id="today-img" alt=""><span class="badge">今日のワンちゃん</span></div>
          <h2 id="today-name"></h2>
          <p id="today-personality" class="personality"></p>
          <div id="today-tags" class="tags"></div>
          <div class="bubble"><p id="today-message"></p></div>
          <div class="actions">
            <button id="today-fav" class="btn pill fav-btn" type="button">♡ お気に入り</button>
            <button id="today-detail" class="btn pill" type="button">くわしく見る</button>
          </div>
          <div class="share">
            <p class="share-label">シェアする</p>
            <div class="share-btns">
              <a id="share-x" class="btn small" target="_blank" rel="noopener">X</a>
              <a id="share-line" class="btn small" target="_blank" rel="noopener">LINE</a>
              <button id="share-copy" class="btn small" type="button">リンクをコピー</button>
              <button id="share-native" class="btn small" type="button" hidden>シェア…</button>
            </div>
            <p id="copy-msg" class="copy-msg" aria-live="polite"></p>
          </div>
        </div>
      </section>

      <!-- 図鑑 -->
      <section id="view-zukan" class="view">
        <h2 class="view-title">🐾 犬種図鑑</h2>
        <p class="view-desc">全12犬種のなかまたち。タップで詳しく見られます。</p>
        <div id="zukan-grid" class="grid"></div>
      </section>

      <!-- 過去 -->
      <section id="view-past" class="view">
        <h2 class="view-title">📅 過去のワンちゃん</h2>
        <p class="view-desc">過去30日に登場したワンちゃんたちです。</p>
        <div id="past-list" class="list"></div>
      </section>

      <!-- お気に入り -->
      <section id="view-fav" class="view">
        <h2 class="view-title">♡ お気に入り</h2>
        <p class="view-desc">お気に入りに登録したワンちゃんたちです。</p>
        <div id="fav-grid" class="grid"></div>
        <div id="fav-empty" class="empty" hidden>
          <p class="empty-icon">🐶</p>
          <p>まだお気に入りがいません。<br>気になる子を見つけたら ♡ を押してね。</p>
        </div>
      </section>

      <!-- 詳細 -->
      <section id="view-detail" class="view">
        <button id="detail-back" class="btn pill back-btn" type="button">← もどる</button>
        <div class="card detail-card">
          <div class="img-wrap"><img id="detail-img" alt=""></div>
          <h2 id="detail-name"></h2>
          <p id="detail-personality" class="personality"></p>
          <div id="detail-tags" class="tags"></div>
          <p id="detail-intro" class="intro"></p>
          <div class="bubble"><p id="detail-message"></p></div>
          <div class="actions"><button id="detail-fav" class="btn pill fav-btn" type="button">♡ お気に入り</button></div>
        </div>
      </section>
    </main>

    <footer class="footer"><p>Today's Wan! — 毎日、ワンちゃんと一緒に。</p></footer>

    <!-- 下部タブ -->
    <nav class="tabbar" aria-label="メインメニュー">
      <button class="tab active" data-view="today" type="button">🏠<span>今日</span></button>
      <button class="tab" data-view="zukan" type="button">📖<span>図鑑</span></button>
      <button class="tab" data-view="past" type="button">📅<span>過去</span></button>
      <button class="tab" data-view="fav" type="button">♡<span>お気に入り</span></button>
    </nav>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
